<div class="theme-panel">
  <h4>Modo</h4>
  <div class="seg"><button type="button" data-mode="dark">Oscuro</button><button type="button" data-mode="light">Claro</button><button type="button" data-mode="auto">Según el sistema</button></div>
  <h4>Paleta</h4>
  <div class="swatches"></div>
  <h4>Personalizar</h4>
  <div class="pickers">
    <label>Principal<input type="color" name="main"></label>
    <label>Acento<input type="color" name="accent"></label>
    <label>Detalle<input type="color" name="second"></label>
  </div>
  <button type="button" class="linklike tp-reset" data-reset="1">Volver a los colores de LetsCrawlit</button>
  <div class="tp-actions">
    <span class="tp-state" aria-live="polite"><span class="tp-dirty" hidden>Cambios sin guardar</span><span class="tp-saved" hidden>Guardado</span></span>
    <button type="button" class="secondary" data-cancel="1">Cancelar</button>
    <button type="button" data-save="1" disabled>Guardar</button>
  </div>
</div>
