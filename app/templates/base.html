<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LetsCrawlit{% endblock %}</title>
  <meta name="theme-color" content="#331942">
  <meta name="htmx-config" content='{"allowEval": false, "selfRequestsOnly": true}'>
  <link rel="preload" href="/static/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23331942'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='700' font-size='15' fill='%23d58cfd'%3ELC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
  <script src="/static/theme.js?v={{ static_v }}"></script>
  <script src="/static/htmx.min.js" defer></script>
  <script type="application/json" id="lc-i18n">{}</script>
  <script src="/static/actions.js?v={{ static_v }}"></script>
  <script src="/static/workbench.js?v={{ static_v }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block header %}
  <header class="top"><div class="in">
    <a class="brand" href="/"><span class="brand-pill">Lets</span>Crawlit</a><small class="byline">by <a href="https://diegohortelano.com/" target="_blank" rel="noopener">Diego Hortelano</a> · <a href="https://www.linkedin.com/in/diego-hortelano-hidalgo/" target="_blank" rel="noopener">LinkedIn</a></small>
    {% set here = request.url.path if request is defined and request else "" %}<nav class="topnav"><a href="/">Auditorías</a><a href="/compare" {% if here.startswith("/compare") %}aria-current="page"{% endif %}>Comparar</a><a href="/trends" {% if here.startswith("/trends") %}aria-current="page"{% endif %}>Tendencias</a><a href="/manual" {% if here.startswith("/manual") %}aria-current="page"{% endif %}>Manual</a></nav><span class="top-spacer"></span>
    {% include "_lang.html" %}
    <details class="theme-menu">
      <summary title="Colores y modo claro u oscuro" aria-label="Apariencia">Apariencia</summary>
      {% include "_theme_panel.html" %}
    </details>
  </div></header>
  {% endblock %}
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
