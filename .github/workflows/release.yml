# Builds the Windows program and attaches it to a GitHub Release.
# Run it by pushing a version tag:  git tag v1.0.0  &&  git push origin v1.0.0
name: Programa para Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          python -m playwright install chromium

      - name: Pruebas
        run: python -m pytest -q

      - name: Crear LetsCrawlit.exe
        run: python -m PyInstaller --noconfirm --clean letscrawl.spec

      - name: Crear el instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path app/config.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyVersion=$v" packaging/letscrawl.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "dist/LetsCrawlit-Setup-$v.exe" LetsCrawlit-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LetsCrawlit-Setup
          path: LetsCrawlit-Setup.exe

      # The release text = NOVEDADES.md (what this version brings; the app shows its «Novedades» list in the
      # new-version window) + how to install, below.
      - name: Texto de la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $notes = Get-Content NOVEDADES.md -Raw -Encoding utf8
          $install = Get-Content .github/release-install.md -Raw -Encoding utf8
          Set-Content release-body.md -Value ($notes.TrimEnd() + "`n`n" + $install) -Encoding utf8

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LetsCrawlit-Setup.exe
          body_path: release-body.md
